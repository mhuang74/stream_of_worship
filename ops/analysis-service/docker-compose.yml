# Define common environment variables using YAML anchor
x-common-env: &common-env
  SOW_R2_BUCKET: ${SOW_R2_BUCKET}
  SOW_R2_ENDPOINT_URL: ${SOW_R2_ENDPOINT_URL}
  SOW_R2_ACCESS_KEY_ID: ${SOW_R2_ACCESS_KEY_ID}
  SOW_R2_SECRET_ACCESS_KEY: ${SOW_R2_SECRET_ACCESS_KEY}
  SOW_ANALYSIS_API_KEY: ${SOW_ANALYSIS_API_KEY}
  SOW_ADMIN_API_KEY: ${SOW_ADMIN_API_KEY}
  # Container paths: CACHE_DIR is operator-tunable; the dump directory is pinned to the
  # bind-mount target (SOW_DEBUG_DUMP_DIR in the env file is the *host* source of that
  # mount and must not be forwarded as the container path).
  CACHE_DIR: ${CACHE_DIR:-/cache}
  SOW_DEBUG_DUMP_DIR: /cache/debug-dumps
  # Base URL printed in "LLM trace report: ..." log lines and returned as
  # JobResult.trace_url. Default follows the published bind address
  # (ports: "${SOW_BIND_IP:-0.0.0.0}:8000:8000"); set this explicitly when fronted by a
  # reverse proxy.
  SOW_DEBUG_DUMP_PUBLIC_BASE_URL: ${SOW_DEBUG_DUMP_PUBLIC_BASE_URL:-http://${SOW_BIND_IP:-localhost}:8000}
  SOW_LRC_MAX_CONCURRENT: ${SOW_LRC_MAX_CONCURRENT:-2}
  # LRC gap placeholders and tail-coverage fill (YouTube transcript path)
  KEY_ALGORITHM_VERSION: ${KEY_ALGORITHM_VERSION:-ks_segment_vote_v1}
  SOW_LRC_GAP_THRESHOLD_BEATS: ${SOW_LRC_GAP_THRESHOLD_BEATS:-12.0}
  SOW_LRC_GAP_PLACEHOLDER_BEATS: ${SOW_LRC_GAP_PLACEHOLDER_BEATS:-4.0}
  SOW_LRC_TAIL_FILL_ENABLED: ${SOW_LRC_TAIL_FILL_ENABLED:-true}
  SOW_LRC_TAIL_GAP_SECONDS: ${SOW_LRC_TAIL_GAP_SECONDS:-30.0}
  SOW_LRC_TAIL_GAP_FRACTION: ${SOW_LRC_TAIL_GAP_FRACTION:-0.15}
  SOW_LRC_TAIL_LEAD_IN_SECONDS: ${SOW_LRC_TAIL_LEAD_IN_SECONDS:-15.0}
  SOW_LRC_TAIL_DUP_WINDOW_SECONDS: ${SOW_LRC_TAIL_DUP_WINDOW_SECONDS:-3.0}
  SOW_LRC_TAIL_WHISPER_MAX_NO_SPEECH_PROB: ${SOW_LRC_TAIL_WHISPER_MAX_NO_SPEECH_PROB:-0.6}
  SOW_LRC_TAIL_MIN_USABLE_PHRASES: ${SOW_LRC_TAIL_MIN_USABLE_PHRASES:-1}
  SOW_VOCAL_SEPARATION_MODEL: ${SOW_VOCAL_SEPARATION_MODEL:-model_mel_band_roformer_ep_3005_sdr_11.4360.ckpt}
  SOW_DEREVERB_MODEL: ${SOW_DEREVERB_MODEL:-UVR-De-Echo-Normal.pth}
  SOW_LOG_LEVEL: ${SOW_LOG_LEVEL:-INFO}
  # LLM Configuration for LRC generation
  SOW_LLM_API_KEY: ${SOW_LLM_API_KEY}
  SOW_LLM_BASE_URL: ${SOW_LLM_BASE_URL}
  SOW_LLM_MODEL: ${SOW_LLM_MODEL}
  # LLM concurrency and rate-limit retry pacing (in-code defaults mirrored here)
  SOW_LLM_MAX_CONCURRENT: ${SOW_LLM_MAX_CONCURRENT:-3}
  SOW_LLM_MIN_INTERVAL_SECONDS: ${SOW_LLM_MIN_INTERVAL_SECONDS:-2.0}
  SOW_LLM_RATE_LIMIT_MAX_RETRIES: ${SOW_LLM_RATE_LIMIT_MAX_RETRIES:-32}
  SOW_LLM_RATE_LIMIT_BASE_DELAY: ${SOW_LLM_RATE_LIMIT_BASE_DELAY:-2.0}
  SOW_LLM_RATE_LIMIT_MAX_DELAY: ${SOW_LLM_RATE_LIMIT_MAX_DELAY:-90.0}
  SOW_LLM_RATE_LIMIT_TIMEOUT_SECONDS: ${SOW_LLM_RATE_LIMIT_TIMEOUT_SECONDS:-1200}
  SOW_LLM_CLASSIFICATION_TIMEOUT_SECONDS: ${SOW_LLM_CLASSIFICATION_TIMEOUT_SECONDS:-60.0}
  SOW_LLM_MODEL_VALIDATION_TIMEOUT_SECONDS: ${SOW_LLM_MODEL_VALIDATION_TIMEOUT_SECONDS:-30.0}
  # v6: LLM segmentation & structured-lyrics alignment knobs
  # (component identification Design C and structured_lyrics alignment).
  # All have in-code defaults; listed here so they're operator-tunable.
  SOW_COMPONENTS_USE_LLM_SEGMENTATION: ${SOW_COMPONENTS_USE_LLM_SEGMENTATION:-false}
  SOW_LLM_SEGMENTATION_MODEL: ${SOW_LLM_SEGMENTATION_MODEL:-}
  SOW_LLM_SEGMENTATION_TIMEOUT_SECONDS: ${SOW_LLM_SEGMENTATION_TIMEOUT_SECONDS:-60}
  SOW_LLM_STRUCTURED_LYRICS_TIMEOUT_SECONDS: ${SOW_LLM_STRUCTURED_LYRICS_TIMEOUT_SECONDS:-60}
  SOW_LLM_STRUCTURED_LYRICS_MAX_ATTEMPTS: ${SOW_LLM_STRUCTURED_LYRICS_MAX_ATTEMPTS:-2}
  SOW_LLM_SEGMENTATION_SANITY_CHECK: ${SOW_LLM_SEGMENTATION_SANITY_CHECK:-false}
  SOW_LLM_SEGMENTATION_MAX_TOKENS: ${SOW_LLM_SEGMENTATION_MAX_TOKENS:-2048}
  # Embedding Provider Configuration
  SOW_EMBEDDING_API_KEY: ${SOW_EMBEDDING_API_KEY}
  SOW_EMBEDDING_BASE_URL: ${SOW_EMBEDDING_BASE_URL}
  SOW_EMBEDDING_MODEL: ${SOW_EMBEDDING_MODEL:-text-embedding-3-small}
  # Whisper runs on Modal (modal_apps/whisper_app.py); tokens come from /opt/sow/.env
  MODAL_TOKEN_ID: ${MODAL_TOKEN_ID}
  MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET}
  SOW_MODAL_WHISPER_APP_NAME: ${SOW_MODAL_WHISPER_APP_NAME:-sow-whisper}
  SOW_MODAL_WHISPER_CLASS_NAME: ${SOW_MODAL_WHISPER_CLASS_NAME:-WhisperTranscriber}
  SOW_MODAL_WHISPER_MAX_ATTEMPTS: ${SOW_MODAL_WHISPER_MAX_ATTEMPTS:-2}
  SOW_MODAL_WHISPER_RETRY_DELAY_SECONDS: ${SOW_MODAL_WHISPER_RETRY_DELAY_SECONDS:-5.0}
  SOW_MODAL_WHISPER_MAX_AUDIO_BYTES: ${SOW_MODAL_WHISPER_MAX_AUDIO_BYTES:-90000000}
  SOW_MODAL_WHISPER_ALLOWED_MODELS: ${SOW_MODAL_WHISPER_ALLOWED_MODELS:-tiny,base,small,medium,large-v3,large-v3-turbo,distil-large-v3}
  SOW_WHISPER_CACHE_VERSION: ${SOW_WHISPER_CACHE_VERSION:-2}
  # Forced alignment runs on Modal (modal_apps/forced_aligner_app.py); same tokens as Whisper
  SOW_MODAL_FORCED_ALIGNER_APP_NAME: ${SOW_MODAL_FORCED_ALIGNER_APP_NAME:-sow-forced-aligner}
  SOW_MODAL_FORCED_ALIGNER_CLASS_NAME: ${SOW_MODAL_FORCED_ALIGNER_CLASS_NAME:-ForcedAligner}
  SOW_MODAL_FORCED_ALIGNER_MAX_ATTEMPTS: ${SOW_MODAL_FORCED_ALIGNER_MAX_ATTEMPTS:-2}
  SOW_MODAL_FORCED_ALIGNER_RETRY_DELAY_SECONDS: ${SOW_MODAL_FORCED_ALIGNER_RETRY_DELAY_SECONDS:-5.0}
  SOW_MODAL_FORCED_ALIGNER_MAX_AUDIO_BYTES: ${SOW_MODAL_FORCED_ALIGNER_MAX_AUDIO_BYTES:-90000000}
  # Long recordings are chunked at <=300s (model limit) up to the total cap
  SOW_FORCED_ALIGN_MAX_CHUNK_SECONDS: ${SOW_FORCED_ALIGN_MAX_CHUNK_SECONDS:-300.0}
  SOW_FORCED_ALIGN_MAX_TOTAL_SECONDS: ${SOW_FORCED_ALIGN_MAX_TOTAL_SECONDS:-900.0}
  SOW_FORCED_ALIGN_CUT_SEARCH_SECONDS: ${SOW_FORCED_ALIGN_CUT_SEARCH_SECONDS:-30.0}
  # Stem separation failover runs on Modal (modal_apps/stem_separator_app.py); same tokens
  SOW_MODAL_STEM_APP_NAME: ${SOW_MODAL_STEM_APP_NAME:-sow-stems}
  SOW_MODAL_STEM_CLASS_NAME: ${SOW_MODAL_STEM_CLASS_NAME:-StemSeparator}
  SOW_MODAL_STEM_MAX_ATTEMPTS: ${SOW_MODAL_STEM_MAX_ATTEMPTS:-2}
  SOW_MODAL_STEM_RETRY_DELAY_SECONDS: ${SOW_MODAL_STEM_RETRY_DELAY_SECONDS:-5.0}
  SOW_MODAL_STEM_MAX_AUDIO_BYTES: ${SOW_MODAL_STEM_MAX_AUDIO_BYTES:-100000000}
  # Full analysis (allin1 + Demucs) runs on Modal (modal_apps/analyzer_app.py); same tokens
  SOW_MODAL_ANALYZER_APP_NAME: ${SOW_MODAL_ANALYZER_APP_NAME:-sow-analyzer}
  SOW_MODAL_ANALYZER_CLASS_NAME: ${SOW_MODAL_ANALYZER_CLASS_NAME:-SongAnalyzer}
  SOW_MODAL_ANALYZER_MAX_ATTEMPTS: ${SOW_MODAL_ANALYZER_MAX_ATTEMPTS:-2}
  SOW_MODAL_ANALYZER_RETRY_DELAY_SECONDS: ${SOW_MODAL_ANALYZER_RETRY_DELAY_SECONDS:-5.0}
  SOW_MODAL_ANALYZER_MAX_AUDIO_BYTES: ${SOW_MODAL_ANALYZER_MAX_AUDIO_BYTES:-150000000}
  # Beat/downbeat grids run on the light Modal app (modal_apps/downbeats_app.py)
  SOW_MODAL_DOWNBEATS_APP_NAME: ${SOW_MODAL_DOWNBEATS_APP_NAME:-sow-downbeats}
  SOW_MODAL_DOWNBEATS_CLASS_NAME: ${SOW_MODAL_DOWNBEATS_CLASS_NAME:-DownbeatDetector}
  SOW_MODAL_DOWNBEATS_MAX_ATTEMPTS: ${SOW_MODAL_DOWNBEATS_MAX_ATTEMPTS:-2}
  SOW_MODAL_DOWNBEATS_RETRY_DELAY_SECONDS: ${SOW_MODAL_DOWNBEATS_RETRY_DELAY_SECONDS:-5.0}
  SOW_MODAL_DOWNBEATS_MAX_AUDIO_BYTES: ${SOW_MODAL_DOWNBEATS_MAX_AUDIO_BYTES:-150000000}
  SOW_ANALYSIS_CACHE_VERSION: ${SOW_ANALYSIS_CACHE_VERSION:-2}
  SOW_ANALYZE_MAX_CONCURRENT: ${SOW_ANALYZE_MAX_CONCURRENT:-2}
  # MVSEP Cloud API Configuration
  SOW_MVSEP_API_KEY: ${SOW_MVSEP_API_KEY}
  SOW_MVSEP_ENABLED: ${SOW_MVSEP_ENABLED:-true}
  SOW_MVSEP_STAGE1_SEP_TYPE: ${SOW_MVSEP_STAGE1_SEP_TYPE:-48}
  SOW_MVSEP_STAGE1_ADD_OPT1: ${SOW_MVSEP_STAGE1_ADD_OPT1:-11}
  SOW_MVSEP_STAGE1_ADD_OPT2: ${SOW_MVSEP_STAGE1_ADD_OPT2}
  SOW_MVSEP_STAGE2_SEP_TYPE: ${SOW_MVSEP_STAGE2_SEP_TYPE:-22}
  SOW_MVSEP_STAGE2_ADD_OPT1: ${SOW_MVSEP_STAGE2_ADD_OPT1:-0}
  SOW_MVSEP_STAGE2_ADD_OPT2: ${SOW_MVSEP_STAGE2_ADD_OPT2:-1}
  SOW_MVSEP_HTTP_TIMEOUT: ${SOW_MVSEP_HTTP_TIMEOUT:-60}
  SOW_MVSEP_STAGE_TIMEOUT: ${SOW_MVSEP_STAGE_TIMEOUT:-300}
  SOW_MVSEP_STAGE2_TIMEOUT: ${SOW_MVSEP_STAGE2_TIMEOUT:-900}
  SOW_MVSEP_TOTAL_TIMEOUT: ${SOW_MVSEP_TOTAL_TIMEOUT:-1800}
  SOW_MVSEP_MAX_CONCURRENT: ${SOW_MVSEP_MAX_CONCURRENT:-1}
  # YouTube Proxy Configuration
  SOW_YOUTUBE_PROXY: ${SOW_YOUTUBE_PROXY}
  SOW_YOUTUBE_PROXY_RETRIES: ${SOW_YOUTUBE_PROXY_RETRIES:-10}
  # YouTube Transcript Rate Limiting
  SOW_YOUTUBE_TRANSCRIPT_MAX_CONCURRENT: ${SOW_YOUTUBE_TRANSCRIPT_MAX_CONCURRENT:-1}
  SOW_YOUTUBE_TRANSCRIPT_MIN_INTERVAL_SECONDS: ${SOW_YOUTUBE_TRANSCRIPT_MIN_INTERVAL_SECONDS:-3.0}
  SOW_YOUTUBE_TRANSCRIPT_MAX_RETRIES: ${SOW_YOUTUBE_TRANSCRIPT_MAX_RETRIES:-3}
  SOW_YOUTUBE_TRANSCRIPT_RETRY_BASE_DELAY: ${SOW_YOUTUBE_TRANSCRIPT_RETRY_BASE_DELAY:-5.0}
  SOW_YOUTUBE_TRANSCRIPT_CIRCUIT_BREAKER_THRESHOLD: ${SOW_YOUTUBE_TRANSCRIPT_CIRCUIT_BREAKER_THRESHOLD:-5}
  SOW_YOUTUBE_TRANSCRIPT_CIRCUIT_BREAKER_COOLDOWN: ${SOW_YOUTUBE_TRANSCRIPT_CIRCUIT_BREAKER_COOLDOWN:-120}
  # DashScope Qwen3 ASR Configuration
  SOW_DASHSCOPE_API_KEY: ${SOW_DASHSCOPE_API_KEY}
  SOW_DASHSCOPE_ASR_REGION: ${SOW_DASHSCOPE_ASR_REGION:-intl}
  SOW_DASHSCOPE_ASR_FLASH_MODEL: ${SOW_DASHSCOPE_ASR_FLASH_MODEL:-qwen3-asr-flash}
  SOW_DASHSCOPE_ASR_FILETRANS_MODEL: ${SOW_DASHSCOPE_ASR_FILETRANS_MODEL:-qwen3-asr-flash-filetrans}
  SOW_DASHSCOPE_ASR_CONTEXT_MAX_CHARS: ${SOW_DASHSCOPE_ASR_CONTEXT_MAX_CHARS:-10000}

  SOW_DASHSCOPE_ASR_TIMEOUT_SECONDS: ${SOW_DASHSCOPE_ASR_TIMEOUT_SECONDS:-300}
  SOW_DASHSCOPE_ASR_FILETRANS_TIMEOUT_SECONDS: ${SOW_DASHSCOPE_ASR_FILETRANS_TIMEOUT_SECONDS:-1800}
  SOW_DASHSCOPE_ASR_MAX_CONCURRENT: ${SOW_DASHSCOPE_ASR_MAX_CONCURRENT:-2}
  SOW_DASHSCOPE_ASR_CACHE_VERSION: ${SOW_DASHSCOPE_ASR_CACHE_VERSION:-1}
  # Fast Analysis (librosa-only) Concurrency
  SOW_FAST_ANALYZE_MAX_CONCURRENT: ${SOW_FAST_ANALYZE_MAX_CONCURRENT:-0}
  SOW_COMPONENT_MAX_CONCURRENT: ${SOW_COMPONENT_MAX_CONCURRENT:-0}
  # BPM Algorithm Configuration (Fast Analysis tempo detection)
  BPM_ALGORITHM_VERSION: ${BPM_ALGORITHM_VERSION:-v4_octave_guard}
  # Free-tier quota waiting (MVSEP, DashScope Qwen3 ASR)
  SOW_QUOTA_POLL_INTERVAL_SECONDS: ${SOW_QUOTA_POLL_INTERVAL_SECONDS:-3600}
  SOW_QUOTA_WAIT_QUIESCENT_LOG_INTERVAL_SECONDS: ${SOW_QUOTA_WAIT_QUIESCENT_LOG_INTERVAL_SECONDS:-1800}
  SOW_PARENT_STEM_WAIT_TIMEOUT_SECONDS: ${SOW_PARENT_STEM_WAIT_TIMEOUT_SECONDS:-7200}
  SOW_STEP_HEARTBEAT_INTERVAL_SECONDS: ${SOW_STEP_HEARTBEAT_INTERVAL_SECONDS:-30.0}
  # Delay before queue processing starts (window to cancel/clear jobs)
  SOW_QUEUE_START_DELAY_SECONDS: ${SOW_QUEUE_START_DELAY_SECONDS:-30}

services:
  analysis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SOW_BIND_IP:-0.0.0.0}:8000:8000"
    environment:
      <<: *common-env
    volumes:
      - analysis-cache:/cache
      - ${SOW_DEBUG_DUMP_DIR:-~/.cache/sow-analysis-service/debug-dumps}:/cache/debug-dumps

  # Development mode: mounts local code for hot-reload
  # Usage: docker compose up analysis-dev
  analysis-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEV_MODE=true
    ports:
      - "${SOW_BIND_IP:-0.0.0.0}:8000:8000"
    environment:
      <<: *common-env
      DEV_MODE: "true"
    volumes:
      - analysis-cache:/cache
      - ./src:/workspace/src:ro
      - ${SOW_DEBUG_DUMP_DIR:-~/.cache/sow-analysis-service/debug-dumps}:/cache/debug-dumps

volumes:
  analysis-cache:
