name: Publish SimDPS worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "delivery/simdps-worker/**"
      - "delivery/render-worker/src/sow_render_worker/simdps_audio.py"
      - ".github/workflows/build-simdps-worker.yml"

concurrency:
  group: simdps-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose the image repository
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-simdps-worker" >> "$GITHUB_OUTPUT"
      - name: Enforce immutable commit tags
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /tmp/simdps-manifest 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            cat /tmp/simdps-manifest >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        id: build
        with:
          context: .
          file: delivery/simdps-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Report image digest
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "`$IMAGE@$DIGEST`" >> "$GITHUB_STEP_SUMMARY"
