name: DSN Diagnostic
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install neon driver
        run: npm init -y >/dev/null && npm i --no-save @neondatabase/serverless >/dev/null
      - name: Probe DSN (host/db only, never password)
        env:
          SOW_DATABASE_URL: ${{ secrets.SOW_DATABASE_URL }}
        run: node --input-type=module -e "
          import { neon } from '@neondatabase/serverless';
          const u = new URL(process.env.SOW_DATABASE_URL);
          console.log('host:', u.hostname);
          console.log('db:', u.pathname, 'user:', u.username);
          try {
            const sql = neon(process.env.SOW_DATABASE_URL);
            const r = await sql.query('select 1');
            console.log('CONNECT OK:', JSON.stringify(r));
          } catch (e) {
            console.log('CONNECT FAIL:', e.name, '-', String(e.message).slice(0, 300));
            process.exit(1);
          }"
