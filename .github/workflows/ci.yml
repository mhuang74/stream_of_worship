name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "delivery/webapp/**"
      - "delivery/render-worker/**"
      - "delivery/simdps-worker/**"
      - "ops/admin-cli/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp-lint-and-test:
    name: Webapp Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery/webapp

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sow
          POSTGRES_PASSWORD: sow
          POSTGRES_DB: sow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: SOW_DATABASE_URL=postgresql://sow:sow@localhost:5432/sow_test?sslmode=disable pnpm exec drizzle-kit migrate

      - run: SOW_DATABASE_URL=postgresql://sow:sow@localhost:5432/sow_test?sslmode=disable pnpm test:postgres-smoke

  admin-lint:
    name: Admin CLI Ruff (F821/F841)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Ruff check (undefined names / unused locals)
        run: uv run --project ops/admin-cli --python 3.11 ruff check --select F821,F841 --no-cache ops/admin-cli/src/ ops/admin-cli/tests/

  render-worker-test:
    name: Render Worker Test
    runs-on: ubuntu-latest
    env:
      SKIP_DOCKER_TESTS: "1"
    defaults:
      run:
        working-directory: delivery/render-worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install --no-cache-dir -r requirements.txt pytest pytest-mock pytest-asyncio

      - name: Install vendored CJK fonts
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/vendor
          sudo cp fonts/*.ttf /usr/share/fonts/truetype/vendor/
          ls -l /usr/share/fonts/truetype/vendor/

      - name: Install FFmpeg
        run: |
          # Pin the static build to the version in delivery/render-worker/Dockerfile
          # so CI encodes with the same libmp3lame/libx264 as production.
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          releases=https://johnvansickle.com/ffmpeg/releases
          checksum=abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67

          download_ffmpeg() {
            curl --max-time 45 --retry 2 --retry-max-time 60 -fsSL -o "$archive" "$1" &&
              printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          }

          if ! download_ffmpeg "$releases/ffmpeg-7.0.2-amd64-static.tar.xz"; then
            echo "::warning::Pinned FFmpeg download failed or returned an invalid archive. Trying the release URL."
            if ! download_ffmpeg "$releases/ffmpeg-release-amd64-static.tar.xz"; then
              echo "::error::Could not download an archive matching the pinned FFmpeg 7.0.2 checksum."
              exit 1
            fi
          fi
          sudo tar -xJ --strip-components=1 -C /usr/local/bin \
            --wildcards "ffmpeg-7.0.2-amd64-static/ffmpeg" "ffmpeg-7.0.2-amd64-static/ffprobe" \
            -f "$archive"
          ffmpeg -version && ffprobe -version

      - run: PYTHONPATH=src pytest tests/ -v
